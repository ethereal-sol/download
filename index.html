<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover" />
  <title>Ethereal — Downloads</title>
  <meta name="color-scheme" content="dark" />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    :root{
      --bg:#050607;
      --border: rgba(255,255,255,.14);
      --border-2: rgba(255,255,255,.09);
      --text: rgba(255,255,255,.92);
      --muted: rgba(255,255,255,.62);
      --radius: 22px;
      --shadow: 0 18px 55px rgba(0,0,0,.68);
      --mono: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      --sans: ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, "Helvetica Neue", Arial, "Noto Sans", "Liberation Sans", sans-serif;
      --space: "Space Mono", var(--mono);

      --sa-left: env(safe-area-inset-left);
      --sa-right: env(safe-area-inset-right);
      --safeX: 16px;
    }

    *{ box-sizing:border-box; }
    html,body{ height:100%; width:100%; overflow-x: clip; }
    @supports not (overflow: clip){
      html,body{ overflow-x:hidden; }
    }

    body{
      margin:0;
      background:
        radial-gradient(1200px 800px at 70% 20%, rgba(255,255,255,.035), transparent 60%),
        radial-gradient(900px 700px at 20% 80%, rgba(255,255,255,.025), transparent 64%),
        var(--bg);
      color: var(--text);
      font-family: var(--sans);
      overflow-y:auto;
      -webkit-text-size-adjust: 100%;
    }

    body.dropdown-open{
      overflow: hidden;
      overscroll-behavior: none;
      touch-action: none;
    }

    canvas#bg{
      position:fixed;
      inset:0;
      z-index:0;
      width:100%;
      height:100%;
      pointer-events:none;
      opacity:.95;
    }

    .vignette{
      position:fixed;
      inset:0;
      z-index:1;
      pointer-events:none;
      background: radial-gradient(circle at 50% 45%, rgba(0,0,0,0), rgba(0,0,0,.62) 70%, rgba(0,0,0,.84) 100%);
    }

    .stage{
      position:relative;
      z-index:2;
      min-height: 100svh;
      display:flex;
      align-items:center;
      justify-content:center;
      --pad: clamp(16px, 3vw, 40px);

      padding-left: var(--safeX);
      padding-right: var(--safeX);
      padding-top: calc(var(--pad) + env(safe-area-inset-top));
      padding-bottom: calc(var(--pad) + env(safe-area-inset-bottom));
    }

    @media (max-height: 720px){
      .stage{ align-items:flex-start; }
    }

    .frame{
      position:relative;
      width:min(920px, 100%);
      margin: 0 auto;
      border-radius: var(--radius);
      border: 1px solid var(--border);
      box-shadow: var(--shadow);
      overflow: visible;

      background: rgba(0,0,0,.52);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);

      opacity:0;
      transform: translateY(14px) scale(.99);
      animation: frameIn .75s cubic-bezier(.2,.9,.25,1) .12s forwards;
    }

    @keyframes frameIn{ to{ opacity:1; transform:none; } }

    .frame-inner{
      position:relative;
      padding: clamp(18px, 3vw, 34px);
      border-radius: var(--radius);
    }

    h1{
      margin:0;
      font-size: clamp(28px, 3.2vw, 44px);
      line-height:1.05;
      letter-spacing:-0.02em;

      font-family: var(--space);
      font-weight: 300;
    }

    .sub{
      margin: 12px 0 0;
      color: var(--muted);
      font-size: clamp(14px, 1.4vw, 16px);
      line-height:1.55;
      max-width: 72ch;

      font-family: var(--space);
      font-weight: 400;
    }

    .divider{
      height:1px;
      background: linear-gradient(90deg, transparent, rgba(255,255,255,.14), transparent);
      margin: 18px 0;
    }

    .grid{
      display:grid;
      grid-template-columns: 1.2fr .8fr;
      gap: 14px;
      align-items:start;
    }

    .grid > *{ width:100%; }

    @media (max-width: 820px){
      .grid{ grid-template-columns: 1fr; }
    }

    .card{
      border: 1px solid var(--border-2);
      border-radius: var(--radius);
      background: rgba(10, 12, 16, .44);
      padding: 14px;
      position:relative;
      overflow: visible;
    }

    .label{
      display:block;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.70);
      letter-spacing: .08em;
      margin-bottom: 10px;
      text-transform: uppercase;
    }

    .select{ position:relative; }

    .select-btn{
      width:100%;
      min-height: 48px;
      display:flex;
      align-items:center;
      justify-content:space-between;
      gap:10px;
      cursor:pointer;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.18);
      background: rgba(0,0,0,.38);
      padding: 14px 14px;
      color: var(--text);
      box-shadow:
        0 0 0 1px rgba(0,0,0,.50) inset,
        0 10px 26px rgba(0,0,0,.50);
      transition: transform .16s ease, border-color .16s ease, box-shadow .16s ease;
      overflow:hidden;
      touch-action: manipulation;
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .select-btn:hover{
      transform: translateY(-1px);
      border-color: rgba(255,255,255,.30);
      box-shadow:
        0 0 0 1px rgba(0,0,0,.50) inset,
        0 12px 30px rgba(0,0,0,.60);
    }

    .select-value{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width:0;
      text-align:left;
    }

    .select-title{
      font-weight: 650;
      font-size: 14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .select-meta{
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.58);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .chev{
      width: 18px;
      height: 18px;
      opacity:.92;
      flex:0 0 auto;
      transition: transform .18s ease;
    }

    .select.open .chev{ transform: rotate(180deg); }

    .dropdown{
      position:absolute;
      left:0; right:0;
      top: calc(100% + 10px);
      border-radius: var(--radius);
      background: rgba(0,0,0,.70);
      box-shadow: 0 18px 55px rgba(0,0,0,.74);
      transform-origin: top;
      z-index:200;

      opacity:0;
      transform: translateY(-6px) scale(.98);
      pointer-events:none;

      max-height: 0;
      padding: 0;
      border: 0;
      overflow: hidden;

      backdrop-filter: blur(14px);
      -webkit-backdrop-filter: blur(14px);
    }

    .select.open .dropdown{
      opacity:1;
      transform: translateY(0) scale(1);
      pointer-events:auto;

      max-height: min(560px, 72vh);
      padding: 8px;
      border: 1px solid rgba(255,255,255,.14);

      overflow-y: auto;
      overflow-x: hidden;

      overscroll-behavior: contain;
      -webkit-overflow-scrolling: touch;
      touch-action: pan-y;

      scrollbar-width: thin;
      scrollbar-color: rgba(255,255,255,.28) rgba(255,255,255,.06);
    }

    .select.open .dropdown::-webkit-scrollbar{ width: 12px; }
    .select.open .dropdown::-webkit-scrollbar-track{ background: rgba(255,255,255,.05); border-radius: 999px; }
    .select.open .dropdown::-webkit-scrollbar-thumb{
      background: rgba(255,255,255,.22);
      border-radius: 999px;
      border: 2px solid rgba(0,0,0,0);
      background-clip: padding-box;
    }
    .select.open .dropdown::-webkit-scrollbar-thumb:hover{ background: rgba(255,255,255,.32); }

    .opt{
      width:100%;
      text-align:left;
      border:0;
      background: transparent;
      color: var(--text);
      padding: 14px 12px;
      border-radius: 16px;
      cursor:pointer;
      display:flex;
      justify-content:space-between;
      gap:12px;
      transition: background .14s ease, transform .10s ease;
      min-height: 52px;
      touch-action: manipulation;
    }

    .opt:hover{ background: rgba(255,255,255,.06); transform: translateY(-1px); }

    .opt[aria-selected="true"]{
      background: rgba(255,255,255,.08);
      outline: 1px solid rgba(255,255,255,.18);
    }

    .opt[disabled]{ opacity:.6; cursor:not-allowed; transform:none !important; }

    .opt .left{
      display:flex;
      flex-direction:column;
      gap:4px;
      min-width: 0;
    }

    .opt .name{
      font-weight: 650;
      font-size: 14px;
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .opt .desc{
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.56);
      white-space:nowrap;
      overflow:hidden;
      text-overflow:ellipsis;
    }

    .opt .tag{
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.72);
      padding: 6px 10px;
      border-radius: 999px;
      border: 1px solid rgba(255,255,255,.14);
      background: rgba(0,0,0,.30);
      flex:0 0 auto;
      align-self:center;
    }

    .btn{
      width:100%;
      border:0;
      cursor:pointer;
      border-radius: 999px;
      padding: 14px 16px;
      min-height: 48px;
      font-size: 14px;
      font-weight: 800;
      letter-spacing:.02em;
      color: rgba(0,0,0,.92);
      background:
        radial-gradient(220px 90px at 30% 0%, rgba(255,255,255,.92), rgba(255,255,255,0) 55%),
        linear-gradient(90deg, rgba(245,245,245,.92), rgba(190,190,190,.86), rgba(140,140,140,.82));
      box-shadow:
        0 18px 45px rgba(0,0,0,.70),
        0 0 0 1px rgba(255,255,255,.14) inset;
      position:relative;
      overflow:hidden;
      transition: transform .16s ease, filter .16s ease;
      user-select:none;
      touch-action: manipulation;
    }

    .btn:disabled{
      opacity:.55;
      cursor:not-allowed;
      filter: grayscale(1);
      transform:none !important;
    }

    .btn::after{
      content:"";
      position:absolute;
      inset:0;
      background: radial-gradient(140px 70px at var(--mx, 50%) var(--my, 50%), rgba(255,255,255,.25), transparent 60%);
      opacity:0;
      transition: opacity .2s ease;
    }

    .btn:hover{ transform: translateY(-2px); filter: brightness(1.04); }
    .btn:hover::after{ opacity:1; }
    .btn:active{ transform: translateY(0px) scale(.995); }

    .btn .btn-inner{
      position:relative;
      display:flex;
      align-items:center;
      justify-content:center;
      gap:10px;
    }

    .btn .dot{
      width:10px; height:10px;
      border-radius:999px;
      background: rgba(0,0,0,.62);
      box-shadow: 0 0 0 2px rgba(255,255,255,.35);
    }

    .info{
      display:flex;
      flex-direction:column;
      gap: 10px;
      padding: 14px;
      border-radius: var(--radius);
      border: 1px solid rgba(255,255,255,.12);
      background: rgba(0,0,0,.34);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
    }

    .info-row{
      display:flex;
      justify-content:space-between;
      gap:12px;
      font-family: var(--mono);
      font-size: 12px;
      color: rgba(255,255,255,.66);
    }

    .grid > * { min-width: 0; }

    .info-row > span,
    .info-row > strong { min-width: 0; }

    .info-row > strong{
      max-width: 60%;
      overflow-wrap: anywhere;
      word-break: break-word;
      text-align: right;
    }

    @media (max-width: 520px){
      .frame{ border-radius: 18px; }
      .frame-inner{ padding: 16px; }
      .card, .info{ border-radius: 18px; }
      .divider{ margin: 16px 0; }
      .select.open .dropdown{ max-height: min(520px, 60vh); }
    }

    :focus-visible{
      outline: 2px solid rgba(255,255,255,.55);
      outline-offset: 3px;
    }

    @media (prefers-reduced-motion: reduce){
      .frame{ animation:none; opacity:1; transform:none; }
      .select-btn, .btn, .opt{ transition:none; }
    }
  </style>
</head>

<body>
  <canvas id="bg" aria-hidden="true"></canvas>
  <div class="vignette" aria-hidden="true"></div>

  <main class="stage">
    <section class="frame" aria-label="Downloads">
      <div class="frame-inner">
        <h1>Ethereal</h1>
        <p class="sub">The Future</p>

        <div class="divider"></div>

        <div class="grid">
          <div class="card">
            <label class="label" for="comboBtn">Выбор файла</label>

            <div class="select" id="select">
              <button class="select-btn" id="comboBtn" type="button" aria-haspopup="listbox" aria-expanded="false" aria-controls="dropdown">
                <span class="select-value">
                  <span class="select-title" id="selTitle">Загрузка…</span>
                  <span class="select-meta" id="selMeta">подтягиваем files_info.json</span>
                </span>
                <svg class="chev" viewBox="0 0 24 24" fill="none" aria-hidden="true">
                  <path d="M6 9l6 6 6-6" stroke="rgba(255,255,255,.85)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
                </svg>
              </button>

              <div class="dropdown" id="dropdown" role="listbox" aria-label="Список файлов"></div>
            </div>

            <div style="height:14px"></div>

            <button class="btn" id="downloadBtn" type="button" disabled>
              <span class="btn-inner">
                <span class="dot" aria-hidden="true"></span>
                <span>Скачать</span>
              </span>
            </button>
          </div>

          <aside class="info">
            <div class="info-row"><span>Платформа</span><strong id="iPlatform">—</strong></div>
            <div class="info-row"><span>Версия</span><strong id="iVersion">—</strong></div>
            <div class="info-row"><span>Размер</span><strong id="iSize">—</strong></div>
            <div class="info-row"><span>Подпись</span><strong id="iNote">—</strong></div>
            <div class="divider" style="margin:6px 0;"></div>
            <div class="info-row"><span>Статус</span><strong id="iStatus">loading…</strong></div>
          </aside>
        </div>
      </div>
    </section>
  </main>

  <script>
    let FILES = [];
    const FILES_URL = "./files_info.json";

    const selectEl = document.getElementById("select");
    const comboBtn = document.getElementById("comboBtn");
    const dropdown = document.getElementById("dropdown");

    const selTitle = document.getElementById("selTitle");
    const selMeta  = document.getElementById("selMeta");

    const iPlatform = document.getElementById("iPlatform");
    const iVersion  = document.getElementById("iVersion");
    const iSize     = document.getElementById("iSize");
    const iNote     = document.getElementById("iNote");
    const iStatus   = document.getElementById("iStatus");

    const downloadBtn = document.getElementById("downloadBtn");

    let selectedIndex = 0;
    let optionButtons = [];
    let focusIndex = 0;

    function applySafeX(){
      const root = document.documentElement;
      const cs = getComputedStyle(root);
      const left = parseFloat(cs.getPropertyValue("--sa-left")) || 0;
      const right = parseFloat(cs.getPropertyValue("--sa-right")) || 0;
      const base = 16;
      const x = Math.max(base, left, right);
      root.style.setProperty("--safeX", x + "px");
    }

    function normalizeFile(x){
      const f = (x && typeof x === "object") ? x : {};
      const name = String(f.name ?? "noname");
      const platform = String(f.platform ?? "");
      const version = String(f.version ?? "");
      const size = String(f.size ?? "");
      const note = String(f.note ?? "");
      const url = String(f.url ?? "");
      const desc = String(f.desc ?? "").trim() || [platform, version].filter(Boolean).join(" · ") || "—";
      return { name, desc, size: size || "—", platform: platform || "—", version: version || "—", note: note || "—", url };
    }

    function setSelected(idx){
      selectedIndex = idx;
      const f = FILES[idx];

      selTitle.textContent = f.name;
      selMeta.textContent  = `${f.platform} · ${f.version} · ${f.size}`;

      iPlatform.textContent = f.platform;
      iVersion.textContent  = f.version;
      iSize.textContent     = f.size;
      iNote.textContent     = f.note;

      iStatus.textContent   = f.url ? "ready to download" : "no url";
      downloadBtn.disabled = !f.url;

      optionButtons.forEach((b, i) => b.setAttribute("aria-selected", String(i === selectedIndex)));
    }

    function isOpen(){ return selectEl.classList.contains("open"); }

    function lockPageScroll(lock){
      if(lock){
        const sw = window.innerWidth - document.documentElement.clientWidth;
        document.body.style.paddingRight = sw > 0 ? sw + "px" : "";
        document.body.classList.add("dropdown-open");
      }else{
        document.body.classList.remove("dropdown-open");
        document.body.style.paddingRight = "";
      }
    }

    function openSelect(){
      if(!FILES.length) return;
      selectEl.classList.add("open");
      comboBtn.setAttribute("aria-expanded", "true");
      lockPageScroll(true);

      focusIndex = selectedIndex;
      const btn = optionButtons[focusIndex];
      if(btn){
        optionButtons.forEach(x => x.tabIndex = -1);
        btn.tabIndex = 0;
        btn.focus({ preventScroll: true });
        btn.scrollIntoView({ block: "nearest" });
      }
    }

    function closeSelect({ returnFocus = false } = {}){
      selectEl.classList.remove("open");
      comboBtn.setAttribute("aria-expanded", "false");
      lockPageScroll(false);
      if(returnFocus) comboBtn.focus({ preventScroll: true });
    }

    function toggleSelect(){
      if(isOpen()) closeSelect();
      else openSelect();
    }

    let dropdownHandlersAttached = false;

    function buildOptions(){
      dropdown.innerHTML = "";
      optionButtons = [];

      if(!FILES.length){
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt";
        btn.disabled = true;
        btn.setAttribute("role", "option");
        btn.innerHTML = `<span class="left"><span class="name">Нет файлов</span><span class="desc">Проверь files_info.json</span></span><span class="tag">—</span>`;
        dropdown.appendChild(btn);
        return;
      }

      FILES.forEach((f, idx) => {
        const btn = document.createElement("button");
        btn.type = "button";
        btn.className = "opt";
        btn.setAttribute("role", "option");
        btn.setAttribute("aria-selected", String(idx === selectedIndex));
        btn.tabIndex = -1;
        btn.dataset.idx = String(idx);

        const left = document.createElement("span");
        left.className = "left";

        const name = document.createElement("span");
        name.className = "name";
        name.textContent = f.name;

        const desc = document.createElement("span");
        desc.className = "desc";
        desc.textContent = `${f.desc} · ${f.size}`;

        const tag = document.createElement("span");
        tag.className = "tag";
        tag.textContent = f.version;

        left.appendChild(name);
        left.appendChild(desc);
        btn.appendChild(left);
        btn.appendChild(tag);

        dropdown.appendChild(btn);
        optionButtons.push(btn);
      });

      if(!dropdownHandlersAttached){
        dropdownHandlersAttached = true;

        dropdown.addEventListener("click", (e) => {
          const btn = e.target.closest("button.opt");
          if(!btn || btn.disabled) return;
          const idx = Number(btn.dataset.idx);
          if(Number.isFinite(idx)){
            setSelected(idx);
            closeSelect({ returnFocus: true });
          }
        }, { passive: true });

        dropdown.addEventListener("keydown", (e) => {
          if(!isOpen() || !optionButtons.length) return;
          const max = optionButtons.length - 1;

          const moveFocus = (next) => {
            focusIndex = Math.max(0, Math.min(max, next));
            const b = optionButtons[focusIndex];
            if(!b) return;
            optionButtons.forEach(x => x.tabIndex = -1);
            b.tabIndex = 0;
            b.focus({ preventScroll: true });
            b.scrollIntoView({ block: "nearest" });
          };

          switch(e.key){
            case "ArrowDown": e.preventDefault(); moveFocus(focusIndex + 1); break;
            case "ArrowUp": e.preventDefault(); moveFocus(focusIndex - 1); break;
            case "Home": e.preventDefault(); moveFocus(0); break;
            case "End": e.preventDefault(); moveFocus(max); break;
            case "Enter":
            case " ":
              e.preventDefault();
              setSelected(focusIndex);
              closeSelect({ returnFocus: true });
              break;
            case "Escape":
              e.preventDefault();
              closeSelect({ returnFocus: true });
              break;
          }
        });
      }
    }

    comboBtn.addEventListener("pointerdown", (e) => {
      e.preventDefault();
      toggleSelect();
    });

    document.addEventListener("pointerdown", (e) => {
      if(!isOpen()) return;
      if(!selectEl.contains(e.target)) closeSelect();
    }, { passive: true });

    document.addEventListener("keydown", (e) => {
      if(e.key === "Escape" && isOpen()) closeSelect({ returnFocus: true });
      if((e.key === "Enter" || e.key === " ") && document.activeElement === comboBtn){
        e.preventDefault();
        openSelect();
      }
    });

    downloadBtn.addEventListener("click", () => {
      const f = FILES[selectedIndex];
      if(!f?.url) return;

      iStatus.textContent = `downloading: ${f.name}`;

      const a = document.createElement("a");
      a.href = f.url;
      a.rel = "noopener";
      a.target = "_blank";
      a.download = "";
      document.body.appendChild(a);
      a.click();
      a.remove();

      window.setTimeout(() => {
        iStatus.textContent = "done";
      }, 900);
    });

    downloadBtn.addEventListener("pointermove", (e) => {
      const r = downloadBtn.getBoundingClientRect();
      const mx = ((e.clientX - r.left) / r.width) * 100;
      const my = ((e.clientY - r.top) / r.height) * 100;
      downloadBtn.style.setProperty("--mx", mx + "%");
      downloadBtn.style.setProperty("--my", my + "%");
    }, { passive: true });

    const bg = document.getElementById("bg");
    const ctx = bg.getContext("2d", { alpha: false, desynchronized: true });

    const glyphs = "01{}[]();=>/\\*+-_#@~$<>|:^.,";
    const keywords = ["ethereal::", "void()", "compile()", "async", "null", "0xDEAD", "signal", "stack", "heap"];

    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
    const mqMobile = window.matchMedia("(max-width: 820px)");

    let columns = [];
    let fontSize = 14;
    let colWidth = 12;
    let lastT = 0;

    function rand(min,max){ return Math.random()*(max-min)+min; }
    function randi(min,max){ return Math.floor(rand(min, max+1)); }

    function resizeBg(){
      const DPR = Math.min(1.6, window.devicePixelRatio || 1);
      bg.width = Math.floor(innerWidth * DPR);
      bg.height = Math.floor(innerHeight * DPR);
      ctx.setTransform(DPR,0,0,DPR,0,0);

      const cssW = innerWidth;
      const cssH = innerHeight;

      fontSize = mqMobile.matches ? 13 : 14;
      colWidth = Math.max(10, Math.floor(fontSize * 0.9));
      const cols = Math.floor(cssW / colWidth);

      columns = Array.from({length: cols}, (_, i) => ({
        x: i * colWidth,
        y: rand(-cssH, 0),
        speed: rand(mqMobile.matches ? 38 : 55, mqMobile.matches ? 95 : 140),
        density: rand(0.45, 0.75),
        seed: Math.random() * 9999
      }));

      ctx.fillStyle = "#050607";
      ctx.fillRect(0,0,cssW,cssH);
    }

    function pickLine(){
      if(Math.random() < 0.08) return keywords[randi(0, keywords.length-1)];
      const len = randi(8, 22);
      let s = "";
      for(let i=0;i<len;i++) s += glyphs[randi(0, glyphs.length-1)];
      return s;
    }

    function draw(t){
      const cssW = innerWidth;
      const cssH = innerHeight;

      const targetFPS = reduceMotion ? 12 : (mqMobile.matches ? 40 : 60);
      const minDt = 1000 / targetFPS;

      if(!lastT) lastT = t;
      const dtMs = t - lastT;
      if(dtMs < minDt){
        requestAnimationFrame(draw);
        return;
      }
      const dt = Math.min(0.06, dtMs/1000);
      lastT = t;

      const fade = reduceMotion ? 0.18 : 0.10;
      ctx.fillStyle = `rgba(5,6,7,${fade})`;
      ctx.fillRect(0,0,cssW,cssH);

      ctx.font = `${fontSize}px ${getComputedStyle(document.documentElement).getPropertyValue("--mono")}`;
      ctx.textBaseline = "top";

      for(const c of columns){
        c.y += c.speed * dt;
        if(Math.random() > c.density) continue;

        const line = pickLine();
        const alpha = rand(0.06, 0.16);
        ctx.fillStyle = `rgba(255,255,255,${alpha})`;

        const jitter = Math.sin((t*0.001)+c.seed) * 0.6;
        ctx.fillText(line, c.x + jitter, c.y);

        if(c.y > cssH + 40){
          c.y = rand(-cssH*0.35, -20);
          c.speed = rand(mqMobile.matches ? 38 : 55, mqMobile.matches ? 95 : 140);
          c.density = rand(0.45, 0.75);
        }
      }

      requestAnimationFrame(draw);
    }

    async function loadFiles(){
      iStatus.textContent = "loading…";
      downloadBtn.disabled = true;

      try{
        const res = await fetch(FILES_URL, { cache: "no-store" });
        if(!res.ok) throw new Error(`HTTP ${res.status}`);
        const data = await res.json();

        let arr = null;
        if(Array.isArray(data)) arr = data;
        else if(data && Array.isArray(data.files)) arr = data.files;
        else if(data && Array.isArray(data.items)) arr = data.items;

        if(!arr) throw new Error("bad json");

        FILES = arr.map(normalizeFile).filter(f => f.name);
        if(!FILES.length) throw new Error("empty list");

        selectedIndex = 0;
        buildOptions();
        setSelected(0);
        iStatus.textContent = "ready";
      }catch(err){
        FILES = [];
        buildOptions();
        selTitle.textContent = "Ошибка загрузки";
        selMeta.textContent = "Файл поврежден";
        iStatus.textContent = `error: ${String(err.message || err)}`;
      }
    }

    applySafeX();
    window.addEventListener("resize", applySafeX, { passive:true });
    window.addEventListener("orientationchange", applySafeX);

    let rq = false;
    window.addEventListener("resize", () => {
      if(rq) return;
      rq = true;
      requestAnimationFrame(() => {
        rq = false;
        resizeBg();
      });
    }, { passive:true });

    resizeBg();
    requestAnimationFrame(draw);
    buildOptions();
    loadFiles();
  </script>
</body>
</html>
